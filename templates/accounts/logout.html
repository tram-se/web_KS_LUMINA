{% extends "accounts/auth_base.html" %}
{% block title %}Đăng xuất | Lumina{% endblock %}
{% block auth_content %}
<div class="logout-card">
  <span class="logout-mark">↗</span>
  <p class="form-kicker">SESSION COMPLETE</p>
  <h2>Đăng xuất?</h2>
  <p class="auth-subtitle">
    Bạn sắp kết thúc phiên {{ logout_area }}. Các phiên đăng nhập ở khu vực khác
    vẫn được giữ nguyên.
  </p>
  <form method="post">
    {% csrf_token %}
    <div class="logout-actions">
      <a class="auth-secondary" href="{{ cancel_url }}">Ở lại</a>
      <button class="auth-submit" type="submit">Đăng xuất</button>
    </div>
  </form>
</div>
{% endblock %}
