{% extends "admin/change_list.html" %} {% block content_title %}
<div
  class="booking-report"
  style="
    display: grid;
    grid-template-columns: repeat(5, minmax(120px, 1fr));
    gap: 12px;
    margin: 0 0 20px;
  "
>
  <form
    method="get"
    style="
      grid-column: 1/-1;
      display: flex;
      gap: 8px;
      align-items: end;
      flex-wrap: wrap;
    "
  >
    <div>
      <label for="report-month">Tháng</label
      ><input
        id="report-month"
        type="number"
        name="month"
        min="1"
        max="12"
        value="{{ report_month.month }}"
      />
    </div>
    <div>
      <label for="report-year">Năm</label
      ><input
        id="report-year"
        type="number"
        name="year"
        min="2000"
        max="2100"
        value="{{ report_month.year }}"
      />
    </div>
    <button type="submit" class="button">Xem thống kê</button>
    <a href="{% url 'admin:accounts_booking_changelist' %}" class="button"
      >Tháng hiện tại</a
    >
  </form>
  <div style="padding: 14px; background: #fff; border: 1px solid #ddd">
    <small>Tổng booking</small
    ><strong style="display: block; font-size: 24px">{{ report_total }}</strong>
  </div>
  <div style="padding: 14px; background: #fff; border: 1px solid #ddd">
    <small>Doanh thu</small
    ><strong style="display: block; font-size: 20px"
      >{{ report_revenue|floatformat:0 }} ₫</strong
    >
  </div>
  <div style="padding: 14px; background: #fff; border: 1px solid #ddd">
    <small>Chờ xác nhận</small
    ><strong style="display: block; font-size: 24px"
      >{{ report_pending }}</strong
    >
  </div>
  <div style="padding: 14px; background: #fff; border: 1px solid #ddd">
    <small>Đã xác nhận</small
    ><strong style="display: block; font-size: 24px"
      >{{ report_confirmed }}</strong
    >
  </div>
  <div style="padding: 14px; background: #fff; border: 1px solid #ddd">
    <small>Đã hủy</small
    ><strong style="display: block; font-size: 24px"
      >{{ report_cancelled }}</strong
    >
  </div>
</div>
{{ block.super }} {% endblock %}
